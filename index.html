<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ontora — Explore Knowledge</title>
<style>
:root {
  color-scheme: light;
  font-family: Inter, system-ui, sans-serif;
  color: #202124;
  background: #f8f9fc;
}
* { box-sizing: border-box; }
body { margin: 0; }
main {
  width: min(760px, 92%);
  margin: 12vh auto 60px;
}
header { margin-bottom: 36px; }
h1 { font-size: 2.5rem; letter-spacing: -1.5px; margin: 0; }
header p { color: #777; }
form {
  display: flex;
  gap: 10px;
  padding: 8px;
  background: white;
  border: 1px solid #e3e5ec;
  border-radius: 18px;
  box-shadow: 0 8px 30px #2021240a;
}
input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  padding: 12px;
  font: inherit;
  background: transparent;
}
button {
  border: 0;
  border-radius: 12px;
  padding: 12px 18px;
  background: #252a36;
  color: white;
  font: inherit;
  cursor: pointer;
}
button:disabled { opacity: .6; }
#status { color: #777; font-size: .9rem; margin: 22px 4px; }
#results { display: grid; gap: 12px; }
article {
  background: #fff;
  border: 1px solid #e9eaf0;
  border-radius: 16px;
  padding: 20px;
}
article h2 { font-size: 1.1rem; margin: 0 0 10px; }
article p { color: #555; line-height: 1.65; }
.meta { color: #777; font-size: .82rem; }
a { color: #425ac7; text-decoration: none; }
a:hover { text-decoration: underline; }
@media(max-width:480px) {
  main { margin-top: 8vh; }
  h1 { font-size: 2rem; }
  form { flex-wrap: wrap; }
  input { width: 100%; }
  button { width: 100%; }
}
</style>
</head>
<body>
<main>
<header>
  <h1>Ontora<span style="color:#6879db">.</span></h1>
  <p>Explore ideas. Discover the research behind them.</p>
</header>

<form id="search-form">
  <input id="query" type="search"
    placeholder="What are you curious about?"
    aria-label="Search knowledge" required>
  <button id="search-button" type="submit">Search ↗</button>
</form>

<p id="status">Search across connected knowledge sources.</p>
<section id="results" aria-live="polite"></section>
</main>

<script src="./hybrid-search.js"></script>
<script src="./ranking.js"></script>
<script src="./ranking-bridge.js"></script>
<script>
const form = document.getElementById("search-form");
const input = document.getElementById("query");
const button = document.getElementById("search-button");
const status = document.getElementById("status");
const results = document.getElementById("results");

form.addEventListener("submit", async event => {
  event.preventDefault();
  const query = input.value.trim();
  if (!query) return;

  button.disabled = true;
  button.textContent = "Searching…";
  status.textContent = "Exploring connected sources…";
  results.replaceChildren();

  try {
    if (!window.OntoraHybridSearch?.search) {
      throw new Error("Hybrid search engine did not load.");
    }

    const response = await window.OntoraHybridSearch.search(query);
    let items = Array.isArray(response)
      ? response
      : response?.results || response?.items || [];

    // ONTORA_ARXIV_FALLBACK
    // Discover arXiv-hosted papers through OpenAlex metadata.
    try {
      const fallbackResponse = await fetch(
        "https://api.openalex.org/works?search=" +
        encodeURIComponent(query) + "&per-page=25"
      );

      if (fallbackResponse.ok) {
        const data = await fallbackResponse.json();

        const fallbackItems = (data.results || [])
          .map(work => {
            const locations = work.locations || [];
            const location = locations.find(loc => {
              const url = loc.landing_page_url || "";
              return /(^|\/)arxiv\.org\//i.test(url) ||
                /^https?:\/\/arxiv\.org\//i.test(url);
            });

            if (!location) return null;

            const url = location.landing_page_url;
            const abstractIndex = work.abstract_inverted_index || {};
            const words = [];

            for (const [word, positions] of Object.entries(abstractIndex)) {
              for (const position of positions) {
                words[position] = word;
              }
            }

            return {
              title: work.title || "Untitled arXiv paper",
              summary: words.filter(Boolean).join(" "),
              description: words.filter(Boolean).join(" "),
              source: "arXiv (via OpenAlex)",
              url,
              type: "research paper"
            };
          })
          .filter(Boolean);

        const existingUrls = new Set(items.map(item => item.url).filter(Boolean));
        items = [
          ...items,
          ...fallbackItems.filter(item => !existingUrls.has(item.url))
        ];
      }
    } catch (fallbackError) {
      console.warn("Ontora arXiv fallback unavailable:", fallbackError);
    }

    if (window.OntoraRanking) {
      items = window.OntoraRanking.rankResults(query, items);
    }

    if (!items.length) {
      status.textContent = "No results returned. Try another topic.";
      return;
    }

    items.forEach(item => {
      const card = document.createElement("article");
      const title = document.createElement("h2");
      const summary = document.createElement("p");
      const meta = document.createElement("div");

      title.textContent = item.title || "Untitled result";
      summary.textContent = item.summary || item.description || "";
      meta.className = "meta";
      meta.textContent = item.source || item.type || "Knowledge source";

      card.append(title, summary, meta);

      if (item.url) {
        const link = document.createElement("a");
        link.href = item.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "Read source ↗";
        card.append(document.createElement("br"), link);
      }

      results.append(card);
    });

    status.textContent = `${items.length} results`;
  } catch (error) {
    console.error(error);
    status.textContent =
      "Search failed. Check the browser console for details.";
  } finally {
    button.disabled = false;
    button.textContent = "Search ↗";
  }
});
</script>

<script src="semantic-expansion.js"></script>
<script src="semantic-bridge.js"></script>

<script src="homepage-enhance.js"></script>

<script src="explore-connection.js"></script>

<script src="query-intelligence.js"></script>

<script src="intelligent-ranking-bridge.js"></script>

<!-- semantic engine temporarily disabled -->
</body>
</html>
